<!DOCTYPE html>
<html lang="cs">

<head>

    <!-- ==================================================
         BASIC
    ================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Coffee Picker | Najdi ideální kapsli</title>

    <meta
        name="description"
        content="Vyber si ideální kapsli podle své chuti. Coffee Picker doporučí nejlepší kapsli z těch, které máš doma."
    >

    <meta
        name="keywords"
        content="coffee, coffee picker, kapsle, nespresso, dolce gusto, starbucks, delonghi, káva"
    >

    <meta
        name="author"
        content="František Lachman"
    >

    <meta
        name="robots"
        content="index,follow"
    >

    <!-- ==================================================
         THEME
    ================================================== -->

    <meta
        name="theme-color"
        content="#F8F5EF"
    >

    <meta
        name="color-scheme"
        content="light dark"
    >

    <!-- ==================================================
         OPEN GRAPH
    ================================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Coffee Picker">

    <meta
        property="og:description"
        content="Najdi ideální kapsli podle své chuti."
    >

    <meta
        property="og:image"
        content="assets/images/og-image.jpg"
    >

    <meta
        property="og:url"
        content="https://frantiseklachman.com/coffeepicker"
    >

    <!-- ==================================================
         TWITTER
    ================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Coffee Picker"
    >

    <meta
        name="twitter:description"
        content="Najdi ideální kapsli podle své chuti."
    >

    <meta
        name="twitter:image"
        content="assets/images/og-image.jpg"
    >

    <!-- ==================================================
         PWA
    ================================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Coffee Picker"
    >

    <!-- ==================================================
         ICONS
    ================================================== -->

    <link
        rel="icon"
        href="assets/icons/favicon.ico"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png"
    >

    <!-- ==================================================
         GOOGLE FONTS
    ================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- ==================================================
         STYLES
    ================================================== -->

    <link rel="stylesheet" href="css/reset.css">

    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/components.css">

    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ==================================================
         BACKGROUND
    ================================================== -->

    <div id="background"></div>

    <!-- ==================================================
         APPLICATION
    ================================================== -->

    <main id="app">

    <!-- ===========================
         QUESTIONNAIRE
    ============================ -->

    <section id="questionnaire">

        <div class="progress">

            <div id="progress"></div>

        </div>

        <header class="question-header">

            <div id="question-icon"></div>

            <h1 id="question-title"></h1>

            <p id="question-subtitle"></p>

        </header>

        <section id="answers"></section>

        <footer class="question-navigation">

            <button
                id="previous-button"
                class="btn btn-glass"
                type="button">

                Zpět

            </button>

            <button
                id="next-button"
                class="btn btn-primary"
                type="button">

                Další

            </button>

            <button
                id="finish-button"
                class="btn btn-primary"
                type="button"
                hidden>

                Zobrazit doporučení

            </button>

        </footer>

    </section>

    <!-- ===========================
         RESULTS
    ============================ -->

    <section
        id="results"
        hidden>

    </section>

</main>

    <!-- ==================================================
         MODALS
    ================================================== -->

    <div id="modal-root"></div>

    <!-- ==================================================
         TOASTS
    ================================================== -->

    <div id="toast-root"></div>

    <!-- ==================================================
         LOADING
    ================================================== -->

    <div id="loading-screen">

        <div class="loading-logo">

            ☕

        </div>

        <p>

            Coffee Picker

        </p>

    </div>

    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

<script type="module" src="js/app.js"></script>

</body>

</html>
